description: Bistable two-slot scaler with optional runtime-configurable slot

compatible: "zmk,input-processor-bistable-scaler"

include: ip_zero_param.yaml

properties:
  type:
    type: int
    required: true
  codes:
    type: array
    required: true
  slot0:
    type: int
    required: true
  slot1:
    type: int
    required: true
  default-coef:
    type: int
  default-coef-slot0:
    type: int
  default-coef-slot1:
    type: int
  zrc-prefix:
    type: string
    required: true
